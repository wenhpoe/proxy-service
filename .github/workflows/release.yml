name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      MAC_CSC_P12_BASE64: ${{ secrets.MAC_CSC_P12_BASE64 }}
      MAC_CSC_P12_PASSWORD: ${{ secrets.MAC_CSC_P12_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Verify tag matches version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "❌ tag (${TAG}) != package.json version (${PKG_VERSION})"
            exit 1
          fi

      - name: Write .env for bundled release config
        shell: bash
        env:
          PROXY_BUNDLED_ENV_BASE64: ${{ secrets.PROXY_BUNDLED_ENV_BASE64 }}
          PROXY_ADMIN_PASSWORD: ${{ secrets.PROXY_ADMIN_PASSWORD }}
          PROXY_ADMIN_SESSION_SECRET: ${{ secrets.PROXY_ADMIN_SESSION_SECRET }}
          FLOW_MYSQL_URL: ${{ secrets.FLOW_MYSQL_URL }}
          FLOW_MYSQL_HOST: ${{ secrets.FLOW_MYSQL_HOST }}
          FLOW_MYSQL_PORT: ${{ secrets.FLOW_MYSQL_PORT }}
          FLOW_MYSQL_USER: ${{ secrets.FLOW_MYSQL_USER }}
          FLOW_MYSQL_PASSWORD: ${{ secrets.FLOW_MYSQL_PASSWORD }}
          FLOW_MYSQL_DATABASE: ${{ secrets.FLOW_MYSQL_DATABASE }}
          FLOW_MYSQL_POOL_SIZE: ${{ secrets.FLOW_MYSQL_POOL_SIZE }}
        run: |
          set -euo pipefail

          if [ -n "${PROXY_BUNDLED_ENV_BASE64}" ]; then
            echo "${PROXY_BUNDLED_ENV_BASE64}" | base64 --decode > .env
            echo "✅ wrote .env from PROXY_BUNDLED_ENV_BASE64"
            exit 0
          fi

          if [ -z "${FLOW_MYSQL_URL}" ] && { [ -z "${FLOW_MYSQL_HOST}" ] || [ -z "${FLOW_MYSQL_USER}" ] || [ -z "${FLOW_MYSQL_DATABASE}" ]; }; then
            echo "❌ Missing MySQL release config. Set PROXY_BUNDLED_ENV_BASE64 or FLOW_MYSQL_URL, or set FLOW_MYSQL_HOST/FLOW_MYSQL_USER/FLOW_MYSQL_DATABASE secrets."
            exit 1
          fi

          BUNDLED_PASSWORD="${PROXY_ADMIN_PASSWORD:-123456}"
          SESSION_SECRET="${PROXY_ADMIN_SESSION_SECRET}"
          if [ -z "${SESSION_SECRET}" ]; then
            SESSION_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
            echo "ℹ️ PROXY_ADMIN_SESSION_SECRET not set; generated one for this build"
          fi
          {
            echo "PROXY_ADMIN_PASSWORD=${BUNDLED_PASSWORD}"
            echo "PROXY_ADMIN_SESSION_SECRET=${SESSION_SECRET}"
            echo "PROXY_ADMIN_SESSION_TTL_SEC=43200"
            echo "PROXY_ACTIVATION_CODE_TTL_SEC=604800"
            echo "PROXY_ADMIN_COOKIE_PERSIST=1"
            if [ -n "${FLOW_MYSQL_URL}" ]; then
              echo "FLOW_MYSQL_URL=${FLOW_MYSQL_URL}"
            else
              echo "FLOW_MYSQL_HOST=${FLOW_MYSQL_HOST}"
              echo "FLOW_MYSQL_PORT=${FLOW_MYSQL_PORT:-3306}"
              echo "FLOW_MYSQL_USER=${FLOW_MYSQL_USER}"
              echo "FLOW_MYSQL_PASSWORD=${FLOW_MYSQL_PASSWORD}"
              echo "FLOW_MYSQL_DATABASE=${FLOW_MYSQL_DATABASE}"
            fi
            if [ -n "${FLOW_MYSQL_POOL_SIZE}" ]; then
              echo "FLOW_MYSQL_POOL_SIZE=${FLOW_MYSQL_POOL_SIZE}"
            fi
          } > .env
          if [ -n "${PROXY_ADMIN_PASSWORD}" ]; then
            echo "✅ wrote .env for bundling (admin + MySQL secrets)"
          else
            echo "✅ wrote .env for bundling (default password 123456 + MySQL secrets)"
          fi

      - name: Import macOS code signing certificate (optional)
        if: runner.os == 'macOS' && env.MAC_CSC_P12_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "${MAC_CSC_P12_BASE64}" | base64 --decode > signing-cert.p12

          KEYCHAIN=build.keychain
          KEYCHAIN_PWD=""

          security create-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security set-keychain-settings -t 3600 -u "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}"
          security default-keychain -s "${KEYCHAIN}"

          security import signing-cert.p12 -k "${KEYCHAIN}" -P "${MAC_CSC_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PWD}" "${KEYCHAIN}"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
