<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>客户端任务 · 代理服务</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/nav.js" defer></script>
    <script src="/time.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <div class="brand">
          <h1>客户端任务</h1>
          <div class="sub">客户端按渠道提交共享任务；服务端控制可用渠道与默认服务商，执行端按 <span class="mono">channel + provider</span> 路由。</div>
        </div>
        <div class="top-actions">
          <button class="btn" id="btnRefresh">刷新</button>
          <div class="pill" title="客户端状态">
            <span class="led" id="led"></span>
            <span class="mono" id="pillText">未连接</span>
          </div>
        </div>
      </header>

      <nav class="nav" aria-label="导航" data-nav></nav>

      <main class="grid">
        <section class="card" aria-label="任务创建" style="grid-column: 1 / -1">
          <div class="card-h">
            <h2>创建任务</h2>
            <div class="row" id="channelTabs"></div>
          </div>
          <div class="card-b">
            <div class="row">
              <span class="chip"><span class="mono">当前渠道</span> <strong id="currentChannel">—</strong></span>
              <span class="chip"><span class="mono">服务商</span> <strong id="currentProvider">—</strong></span>
              <span class="chip"><span class="mono">提交机器</span> <strong id="submitMachineId">—</strong></span>
            </div>
            <div style="height: 12px"></div>
            <div class="row">
              <label style="min-width: 110px">目标执行机器</label>
              <select id="targetMachineId" class="input" style="max-width: 320px"></select>
            </div>
            <div style="height: 10px"></div>
            <div class="row">
              <label style="min-width: 110px">任务类型</label>
              <input id="taskType" class="input mono" style="max-width: 320px" value="video_generate" />
            </div>
            <div style="height: 10px"></div>
            <div class="row">
              <label style="min-width: 110px">Prompt</label>
              <input id="prompt" class="input" placeholder="输入创作描述" />
            </div>
            <div style="height: 10px"></div>
            <div class="row">
              <label style="min-width: 110px">附加参数(JSON)</label>
            </div>
            <div style="height: 10px"></div>
            <div class="row">
              <label style="min-width: 110px">首帧图片</label>
              <input id="firstFrameFile" type="file" accept="image/*" class="input" style="max-width: 420px" />
              <button class="btn" id="btnUseDemoFirstFrame" type="button">填充演示图</button>
            </div>
            <div style="height: 6px"></div>
            <div class="hint" id="firstFrameHint">可先用演示图快速验证链路；后续再接正式上传能力。会自动写入 <span class="mono">extra_body.firstFrameUrl</span></div>
            <div style="height: 6px"></div>
            <textarea id="paramsJson" class="mono" style="min-height: 220px"></textarea>
            <div style="height: 10px"></div>
            <div class="row">
              <button class="btn primary" id="btnCreate">提交任务</button>
              <button class="btn" id="btnExample">填充示例</button>
            </div>
            <div class="status" id="status" role="status" aria-live="polite" hidden></div>
          </div>
        </section>

        <section class="card" aria-label="批次列表" style="grid-column: 1 / -1">
          <div class="card-h">
            <h2>最近批次</h2>
          </div>
          <div class="card-b">
            <div id="batchList"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = {
        channels: [],
        currentChannelKey: '',
        machines: [],
        submitMachineId: '',
        batches: [],
      };

      function setStatus(kind, text) {
        const el = $('status');
        el.hidden = false;
        el.className = `status ${kind}`;
        el.textContent = text;
      }

      function setLed(ok, text) {
        $('led').style.background = ok ? '#22c55e' : '#ef4444';
        $('pillText').textContent = text;
      }

      async function j(url, init = {}) {
        const res = await fetch(url, {
          ...init,
          headers: {
            accept: 'application/json',
            ...(init.headers || {}),
          },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data?.ok === false) throw new Error(data?.error || `请求失败（HTTP ${res.status}）`);
        return data;
      }

      function setFirstFrameHint(text) {
        $('firstFrameHint').textContent = text;
      }

      function currentChannel() {
        return state.channels.find((item) => item.key === state.currentChannelKey) || null;
      }

      function examplePayload(channelKey) {
        if (channelKey === 'seedance') {
          return {
            model: 'dreamina-seedance-2-0-260128',
            prompt: '在极简灰色的展台上，[图片1]中的香水瓶正在缓慢旋转，背景有流动的丝绸感，电影级布光，4k超高清',
            size: '9:16',
            seconds: 5,
            extra_body: {
              firstFrameUrl: '',
              generate_audio: true,
            },
          };
        }
        return {
          prompt: '在 Flow 中执行默认自动化任务',
          aspect_ratio: '16:9',
          references: [],
        };
      }

      function renderTabs() {
        const root = $('channelTabs');
        root.innerHTML = '';
        state.channels.forEach((channel) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = channel.key === state.currentChannelKey ? 'btn primary' : 'btn';
          btn.textContent = channel.label || channel.key;
          btn.addEventListener('click', () => selectChannel(channel.key));
          root.appendChild(btn);
        });
      }

      function renderCurrentChannel() {
        const channel = currentChannel();
        $('currentChannel').textContent = channel?.label || '—';
        $('currentProvider').textContent = channel?.selected_provider || '—';
      }

      function renderMachines() {
        const select = $('targetMachineId');
        const options = [
          `<option value="">默认（当前机器）</option>`,
          ...state.machines.map((machine) => `<option value="${machine.machineId}">${machine.machineId}${machine.note ? ` · ${machine.note}` : ''}</option>`),
        ];
        select.innerHTML = options.join('');
        $('submitMachineId').textContent = state.submitMachineId || '—';
      }

      function renderBatches() {
        const root = $('batchList');
        if (!state.batches.length) {
          root.innerHTML = '<div class="hint">暂无批次</div>';
          return;
        }
        root.innerHTML = state.batches
          .map((batch) => {
            const tasks = Array.isArray(batch.tasks) ? batch.tasks : [];
            const taskHtml = tasks
              .map((task) => {
                const content = task.resultPayload?.content || task.resultPayload?.output || task.resultPayload || null;
                return `
                  <div style="padding:10px 0;border-top:1px solid rgba(148,163,184,.18)">
                    <div class="row" style="justify-content:space-between">
                      <strong>${task.taskType || '—'}</strong>
                      <span class="mono">${task.status || 'queued'}</span>
                    </div>
                    <div class="hint mono">task=${task.id} · channel=${task.channel || 'flow'} · provider=${task.provider || '1'}</div>
                    <div class="hint">prompt：${task.prompt || '—'}</div>
                    <div class="hint">结果：${content ? JSON.stringify(content) : '—'}</div>
                  </div>
                `;
              })
              .join('');
            return `
              <details class="task-tree" open>
                <summary>${batch.id} · ${batch.status || 'queued'} · ${tasks.length} tasks</summary>
                <div>${taskHtml}</div>
              </details>
            `;
          })
          .join('');
      }

      function selectChannel(channelKey) {
        state.currentChannelKey = channelKey;
        renderTabs();
        renderCurrentChannel();
        $('paramsJson').value = JSON.stringify(examplePayload(channelKey), null, 2);
      }

      async function loadChannels() {
        const data = await j('/v1/client/channels');
        state.channels = Array.isArray(data.channels) ? data.channels : [];
        if (!state.channels.length) throw new Error('当前没有可用渠道');
        if (!state.channels.find((item) => item.key === state.currentChannelKey)) {
          state.currentChannelKey = state.channels[0].key;
        }
        renderTabs();
        renderCurrentChannel();
      }

      async function loadMachines() {
        const data = await j('/v1/client/executor-machines');
        state.machines = Array.isArray(data.machines) ? data.machines : [];
        state.submitMachineId = data.submitMachineId || '';
        renderMachines();
      }

      async function loadBatches() {
        const data = await j('/v1/client/task-batches?limit=10');
        state.batches = Array.isArray(data.batches) ? data.batches : [];
        renderBatches();
      }

      async function createBatch() {
        const channel = currentChannel();
        if (!channel) throw new Error('未选择渠道');
        const params = JSON.parse($('paramsJson').value || '{}');
        const prompt = String($('prompt').value || params.prompt || '').trim();
        const taskType = String($('taskType').value || 'video_generate').trim();
        const task = {
          channel: channel.key,
          provider: channel.selected_provider,
          taskType,
          prompt,
          inputPayload: params,
        };
        const payload = {
          targetMachineId: $('targetMachineId').value || undefined,
          tasks: [task],
        };
        const data = await j('/v1/client/task-batches', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
        });
        setStatus('good', `提交成功：${data.batch?.id || '—'}`);
        await loadBatches();
      }

      function fillDemoFirstFrame() {
        const publicUrl = 'https://aigc-cdn.toseek.net/flow-task-system/submit-assets/seedance/manual-test/test-seedance.png';
        const params = JSON.parse($('paramsJson').value || '{}');
        params.extra_body = params.extra_body && typeof params.extra_body === 'object' ? params.extra_body : {};
        params.extra_body.firstFrameUrl = publicUrl;
        $('paramsJson').value = JSON.stringify(params, null, 2);
        setFirstFrameHint(`已填充演示图 firstFrameUrl：${publicUrl}`);
      }

      async function refreshAll() {
        try {
          await loadChannels();
          await loadMachines();
          await loadBatches();
          setLed(true, '已连接');
        } catch (err) {
          setLed(false, '请求失败');
          setStatus('bad', err.message || '加载失败');
        }
      }

      $('btnRefresh').addEventListener('click', () => refreshAll());
      $('btnExample').addEventListener('click', () => {
        $('paramsJson').value = JSON.stringify(examplePayload(state.currentChannelKey), null, 2);
      });
      $('btnCreate').addEventListener('click', async () => {
        try {
          await createBatch();
        } catch (err) {
          setStatus('bad', err.message || '提交失败');
        }
      });
      $('btnUseDemoFirstFrame').addEventListener('click', () => fillDemoFirstFrame());

      window.refresh = refreshAll;
      window.addEventListener('load', async () => {
        await refreshAll();
        if (!$('paramsJson').value) $('paramsJson').value = JSON.stringify(examplePayload(state.currentChannelKey || 'flow'), null, 2);
      });
    </script>
  </body>
</html>
